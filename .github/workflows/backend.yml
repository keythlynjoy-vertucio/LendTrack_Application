name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lendtrack_test
          POSTGRES_USER: lendtrack
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pdo_sqlite, mbstring, gd, zip, bcmath, intl
          coverage: none
      - run: mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs
      - run: composer install --prefer-dist --no-interaction
      - run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: vendor/bin/phpunit -c phpunit.mobile.xml
      - name: Verify fresh PostgreSQL migrations
        run: php artisan migrate --force
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lendtrack_test
          DB_USERNAME: lendtrack
          DB_PASSWORD: ci-only-password
      - name: Build deployment image
        run: docker build -t lendtrack-backend .
