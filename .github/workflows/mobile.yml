name: Mobile checks
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      # Keep legacy Material imports compatible with the owner's SDK.
      # Newer Flutter reports them as informational deprecations. Errors/warnings remain fatal.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
